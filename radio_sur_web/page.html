            <script>
                const audio = document.getElementById('audio');
const playButton = document.getElementById('play-button');
const seekBar = document.getElementById('seek-bar');
const currentTimeDisplay = document.getElementById('current-time');
const durationDisplay = document.getElementById('duration');

// Cambia las imágenes al cargar el estado de reproducción
playButton.addEventListener('click', () => {
    if (audio.paused) {
        audio.play();
        playButton.src = 'multimedia/pausse_button.png'; // Cambia a ícono de pausa
    } else {
        audio.pause();
        playButton.src = 'multimedia/play_button.png'; // Cambia a ícono de play
    }
});

// Actualiza la barra de progreso y el tiempo
audio.addEventListener('timeupdate', () => {
    seekBar.value = audio.currentTime;
    currentTimeDisplay.textContent = formatTime(audio.currentTime);
});

// Establece la duración total cuando se carga el archivo
audio.addEventListener('loadedmetadata', () => {
    durationDisplay.textContent = formatTime(audio.duration);
    seekBar.max = audio.duration;
});

// Control de progreso manual
seekBar.addEventListener('input', () => {
    audio.currentTime = seekBar.value;
});

// Función para formatear el tiempo
function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

        // Inicializa Firebase

        // Obtiene una referencia a la base de datos
        const database = firebase.database();

        // Obtiene una referencia al número de WhatsApp
        const whatsappNumberRef = database.ref('LinkWpp'); // Reemplaza 'whatsappNumber' con la ruta correcta

        // Lee el número de WhatsApp desde la base de datos
        whatsappNumberRef.on('value', (snapshot) => {

                // Actualiza el enlace de WhatsApp en el HTML
                const whatsappLink = document.querySelector('.title6 a[href^="https://wa.me/"]');
                if (whatsappLink) {

                }
            } else {
                console.error('No se encontró el número de WhatsApp en la base de datos.');
            }
        })
        // Referencia a los anuncios en la base de datos
const anunciosRef = database.ref('Anuncios');

// Escucha cambios en los datos de anuncios
anunciosRef.on('value', (snapshot) => {
    const anuncios = snapshot.val();
    const carouselInner = document.getElementById('carousel-data');
    carouselInner.innerHTML = ''; // Limpia cualquier dato existente

    if (anuncios) {
        Object.keys(anuncios).forEach((key) => {
            const anuncio = anuncios[key];
            if (anuncio) { // Evita claves vacías
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="anuncio-content">
                        <h3>${key}</h3>
                        <p>${anuncio}</p>
                    </div>
                `;
                carouselInner.appendChild(slide);
            }
        });
    } else {
        console.error('No se encontraron anuncios en la base de datos.');
    }
});

// Funciones para mover las diapositivas
let currentIndex = 0;

function moveSlide(direction) {
    const carouselInner = document.getElementById('carousel-data');
    const slides = carouselInner.children;
    const totalSlides = slides.length;

    if (totalSlides > 0) {
        currentIndex = (currentIndex + direction + totalSlides) % totalSlides;
        const offset = -currentIndex * 100;
        carouselInner.style.transform = `translateX(${offset}%)`;
    }
}
// Variable de control para el intervalo
let autoSlideInterval;

// Función para iniciar el carrusel automático
function startAutoSlide() {
    autoSlideInterval = setInterval(() => {
        moveSlide(1); // Avanza a la siguiente diapositiva automáticamente
    }, 3000); // Cambia cada 3 segundos (puedes ajustar el tiempo)
}

// Función para detener el carrusel automático (opcional si necesitas detenerlo)
function stopAutoSlide() {
    clearInterval(autoSlideInterval);
}

// Inicia el carrusel automático cuando la página carga
window.onload = () => {
    startAutoSlide();
};


    </script>
